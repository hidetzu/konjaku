name: check

on:
  pull_request:
  push:
    # ⚠ **`develop` が、⚠ いまの主線**（`docs/adr/0050`）。
    #   ⚠ **足すまで、⚠ `develop` へ取り込んだあとの検査が走っていなかった**
    #     （⚠ 実測 2026-08-29: `main` より **30 コミット先**だった）。
    #   ⚠ **PR で `render-scope.mjs` が絞ったぶんは、⚠ この push で取り戻す**（下の render-plan）。
    #   ⚠ **外部リンク（全部）も、⚠ PR では走らない。**⚠ ここしか見る機会が無い。
    branches: [main, develop]
  # 外部サイトのURLは自分たちの都合と関係なく消えるので、定期的にも見る
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

# ⚠ 既定の権限を読み取りだけにする。public にすると、fork からの PR でも
#   Workflow が動きうる。書き込み権限を渡さない。
permissions:
  contents: read

# ⚠ Playwright の版は、ここだけで決める。
#   入れる版とキャッシュのキーの両方がこれを見る（出どころを2つ持たない）。
env:
  PLAYWRIGHT_VERSION: "1.62.1"
  # ⚠ **wrangler の版も、⚠ ここだけで決める**（2026-08-29。`docs/adr/0070`）。
  #   ⚠ **`npx wrangler` と書くと、⚠ その日の最新が降ってくる。**
  #   ⚠ **配信の道具が、⚠ こちらの差分なしに入れ替わる**（⚠ Playwright と同じ踏み方）。
  WRANGLER_VERSION: "4.127.1"
  # ⚠ **v0.1.0 を出す先**（`docs/adr/0050`。⚠ 名前を付けたのは Cloudflare の画面）。
  #   ⚠ **β 版（`konjaku.hidetzu.work`）ではない。**
  NEXT_ORIGIN: "https://dev.konjaku.hidetzu.work"

# 古い実行を止める。⚠ **PR のときだけ**キャンセルする。
#   main への push は、そこでしか走らない検査（外部リンク・全部）を持っているので、
#   後から来た push に追い越されて消えると、その回の結果が永久に残らない。
concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ⚠ **Action は SHA で固定する。** タグは動かせるので、`@v4` のままだと
#   タグの指す先が変わった時点で、こちらの差分なしに中身が入れ替わる。
#   公開リポジトリでは fork からの PR も走りうるので、ここは締めておく。
#   ⚠ 上げるときは SHA を書き換える。**上げたことが差分に出る**のが要点。
#
# ⚠ **課金はジョブ単位で分に切り上げられる。**
#   実測（2026-08-15・8/1〜15 の 173 実行）: 実作業 390 秒（6.5分）に対して課金 9 分。
#   とくに `静的検査` は **8 秒の仕事に 1 分**を払っており、173 回で 144 分が
#   切り上げだけで消えていた。
#   → 1分に満たないもの・端数のものは**1つのジョブに束ねる**。
#   ⚠ 束ねても実時間は伸びない。重い実描画（約 240 秒）と並列のままなので、
#     待ち時間は実描画で決まる。
jobs:
  # 外へ出ない検査と、出る検査をまとめて1ジョブにする。
  # 実測: 静的 8s ＋ 外部リンク 12s ＋ 検索 86s ＝ 106 秒 → 2 分（束ねる前は 4 分）。
  # ⚠ 落ちたときに早く分かるよう、**速いものから**並べる。
  checks:
    # ⚠ **既定は 360 分（6 時間）。**気づかないとその間ずっと枠を食う。
    #   実測（2026-08-18・成功した 12 回）: 1分33秒 〜 1分48秒。
    #   ⚠ `main` では外部リンクを全部（8 本）叩くので、そのぶんの余裕を見て 10 分。
    timeout-minutes: 10
    name: 静的検査・外部リンク
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⚠ 外部リンク（足した分）が、比べる相手（base）を要る
          fetch-depth: 0
          # ⚠ 認証情報を .git/config に残さない。fork の PR で走るコードに拾わせない
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      # 依存ゼロだが、npm ci が通ること自体がデプロイの前提条件
      - run: npm ci

      # ⚠ ここでは外へ1本も出ない。外部リンクは「何本あるか」を数えるだけで、
      #   生死は下の2つが見る。数えるだけでも、走査そのものが壊れたら止まる
      #   （2026-08-14 に readdir で落ちたのを、マージ後まで見逃した）。
      - name: 構文・デプロイ設定・出典・OGP・外部から来た文字列
        run: node test/check.mjs

      # ⚠ **PR ごとに外部サイトを叩かない**方針は変えていない。
      #   叩くのは「このブランチで新しく足した URL」だけで、実測（直近12コミット）で
      #   平均 0.00 本／PR・最大 0 本。ほとんどの PR は外へ1本も出ない。
      #   ⚠ ここは落ちてよい。足したばかりの URL に一度も到達できないのは、
      #     ほぼこちらの打ち間違いだから（既知の TLS の件だけは警告のまま／1回再試行する）。
      # ⚠ fork の PR では skip する。新しい URL を足されると、その URL へ実際に出る。
      #   見知らぬ人が書いた宛先へ、こちらの CI から通信させない。
      - name: 外部リンク（このブランチで足した分）
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        # ⚠ ここで `git fetch` しない。persist-credentials: false にしてあるので、
        #   private リポジトリでは認証できずに落ちる（実際に落ちた: 2026-08-15
        #   "could not read Username for 'https://github.com'"）。
        #   上の checkout が fetch-depth: 0 で全ブランチを取っているので、
        #   origin/<base> はもう手元にある。
        # ⚠ 万一取れていなければ check.mjs が「比べる相手を読めなかったので全部叩く」と
        #   言って 8 本叩く（掟: 取れなかったを「無い」と言わない）。
        #   **ログにその警告が出ていないこと**で、比較できていることを確かめる。
        run: node test/check.mjs --links-new=origin/"$BASE"

      # PR ごとに外部サイトを叩くのは迷惑なので、main と定期実行のときだけ。
      # ⚠ ここは既存のリンクも含めて 8 本すべてを見るので、相手先の一時的な不調が混ざる。
      #   だから**この段だけ**落ちても止めない（continue-on-error は step にも書ける）。
      - name: 外部リンク（全部）
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node test/check.mjs --links


  # ⚠ **検索を独立したジョブにした**（2026-08-22。Owner 判断）。
  #   ⚠ **理由は速さではない。**⚠ **検索の実装（Repository の切り出し・hidetzu/konjaku#181）を
  #     進めながら、⚠ そこだけを見て回せるようにする。**
  #   ⚠ **落ちたときに、⚠ 何が壊れたのかがジョブ名で分かる**（⚠ 静的検査に埋もれない）。
  # ⚠ **fixture で回す**（hidetzu/konjaku#204）。⚠ **外へは 1 本も出ない。**
  #   ⚠ **前は 42 語を地理院へ投げ、⚠ 73 秒（静的ジョブ 85 秒の 86%）を使っていた。**
  #   ⚠ **その大半は待ち**（10req/10秒 の制限に合わせた 1.5 秒 × 42 語）。
  # ⚠ **fork の skip をやめられた。**⚠ **前は fork の PR で検索の並びを検証していなかった**
  #   （⚠ 地理院へ通信が飛ぶため skip していた）。⚠ **外へ出ないので、⚠ もう skip しない。**
  # ⚠ **相手先が生きているかは、⚠ 下の別ジョブが定期・手動で見る。**
  #   ⚠ **fixture にしたことで、⚠ 誰も相手先を見なくなる**のが、⚠ この変更のいちばんの危険。
  search:
    name: 検索の並び（42語・fixture）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      # ⚠ **口の作り**（1検索1リクエスト・再試行・時間切れ・形）。⚠ **外へは出ない。**
      #   ⚠ **本番の口をそのまま動かす**（2026-08-22。hidetzu/konjaku#181）。
      - name: 住所検索の口（1検索1リクエスト / 再試行の上限 / 時間切れ / 形）
        run: node test/repository-check.mjs
      # ⚠ **並べ替えの回帰。**⚠ **こちらも本番の口を通す**（⚠ fixture は fetch の応答として渡す）。
      - name: 42語の回帰（1位27以上 / 3位内34以上 / 圏外0 / 誤発火0 / 決められない語で発火0）
        run: node test/search-check.mjs

  # ⚠ **本物の地理院と話せるか**だけを見る（2026-08-22。hidetzu/konjaku#204）。
  #   ⚠ **PR では走らせない。**⚠ 定期（週 1）と手動のときだけ。
  #   ⚠ **ここが落ちても、⚠ こちらのコードが壊れたわけではない**（出力にもそう書く）。
  #   ⚠ **並べ替えの回帰は静的ジョブが fixture で見ている。**⚠ 二重に叩かない。
  search-live:
    name: 住所検索と話せるか（本物・数語）
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v5.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      - run: node test/search-live-check.mjs
  # ⚠ **実描画は 3 つに分かれている**（2026-08-22。hidetzu/konjaku#190）。
  #
  #     render-plan  どれを回すか決める（⚠ ブラウザを立てない。数秒）
  #     render-run   ⚠ **suite ごとに、⚠ 別のジョブで同時に回す**
  #     render       ⚠ **門番。**⚠ 必須チェックの名前はこれ
  #
  # ⚠ **`実描画` という名前を、⚠ 門番のほうに残している。**
  #   ⚠ **matrix のジョブは `実描画 top/core` のように名前が変わる。**
  #   ⚠ **必須チェックは名前で照合するので、⚠ 名前が変わると報告が来ないまま永久に待ちになる。**
  #   ⚠ **だから門番を置く。**⚠ 名前を変えるときは、⚠ ruleset も一緒に直す。

  render-plan:
    name: 実描画の計画
    # ⚠ **fork からの PR では走らせない。** 実描画は国土地理院のタイルを実際に取りに行く。
    #   public にすると、見知らぬ人の PR から地理院へ通信が飛ぶ
    #   （掟: 地理院への負荷は自分の請求とは別に見る）。
    #   ⚠ **代償: fork の PR は実描画で検証されない。** 取り込んでから main で検証する。
    #     offline で回せるようにするのは別の課題（fixture が要る）。
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    # ⚠ **ここはブラウザを立てない。**⚠ 差分を読んで決めるだけ。
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.scope.outputs.matrix }}
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⚠ 下の「画面に届きうるか」が、比べる相手（base）を要る
          fetch-depth: 0
          persist-credentials: false

      # ⚠ **この変更が画面に届きうるときだけ、実描画を回す。**
      #   実測（2026-08-18・成功した 11 回）: 実描画は 5分54秒 〜 6分46秒。
      #   ⚠ **画面に届かない変更で、この待ちを引き受けない。**
      #   （⚠ ブラウザの用意の固まりやすさは下に書いた。⚠ **2026-08-22 の実測では 20 / 20 で通っている**）
      #
      # ⚠ **`paths-ignore` を使わない。** あれは Workflow ごと走らせないので、
      #   ⚠ **必須チェックにしていると、報告が来ないまま永久に待ちになる。**
      #   ここはジョブを起こしたうえで中で決めるので、**「実描画」は必ず結果を返す**。
      #
      # ⚠ **除く範囲は `test/render-scope.mjs` が 1 か所で持つ**（下の段で呼んでいる）。
      #   ⚠ **ここに書き写さない。**⚠ 2 か所に書くと片方だけ古くなる（CLAUDE.md §3）。
      #   ⚠ **実際に古くなった**（2026-08-22。ここに「除くのは `.claude/` だけ」と書いてあったが、
      #     ⚠ hidetzu/konjaku#188 以降 `docs/` も除いている）。
      #   ⚠ **除いても、静的検査は全追跡ファイルを走査している**（Issue 番号・Slack の秘密）。
      #     ⚠ **見張りが外れるわけではない。**
      #
      # ⚠ **既定は「回す」。**差分が取れなかったときも回す（取れなかった ≠ 変更が無い）。
      #   ⚠ 定期実行・手動実行には比べる相手が無いので、必ず回る。
      - name: この変更が画面に届きうるか
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -u
          files=""
          if [ "$EVENT" = "pull_request" ]; then
            files=$(git diff --name-only "origin/$BASE...HEAD" 2>/dev/null || true)
          elif [ "$EVENT" = "push" ]; then
            files=$(git diff --name-only "$BEFORE" HEAD 2>/dev/null || true)
          fi
          # ⚠ **どの suite を回すかは `test/render-scope.mjs` が決める**（2026-08-22）。
          #   ⚠ **判定をここに書き写さない。**⚠ 2 か所に書くと、⚠ 片方だけ古くなる（CLAUDE.md §3）。
          #   ⚠ **手元でも同じものを使える**: `node test/render-scope.mjs origin/main...HEAD`
          # ⚠ **main へ入るときは、⚠ 必ず全部回す**（⚠ PR で絞ったぶんを、⚠ ここで取り戻す）。
          #   ⚠ **その一覧も `render-scope.mjs` が持つ**（`--all`）。⚠ ここに書かない。
          if [ -z "$files" ]; then
            echo "⚠ 変更の一覧を取れなかった（または比べる相手が無い）。全部回す"
            matrix=$(node test/render-scope.mjs --all --json)
          elif [ "$EVENT" = "push" ]; then
            echo "変更 $(echo "$files" | wc -l | tr -d ' ') ファイル:"
            echo "$files" | sed 's/^/  /'
            echo "⚠ main への取り込みなので、⚠ 全部回す"
            matrix=$(node test/render-scope.mjs --all --json)
          else
            echo "変更 $(echo "$files" | wc -l | tr -d ' ') ファイル:"
            echo "$files" | sed 's/^/  /'
            matrix=$(node test/render-scope.mjs --json "origin/$BASE...HEAD")
          fi
          n=$(echo "$matrix" | jq 'length')
          if [ "$n" = "0" ]; then
            echo "⚠ この実行では実描画を回していない（画面にも実行環境にも届かない変更だけ）"
            echo "⚠ 静的検査は回っている（全追跡ファイルを走査している。docs/ も読む）"
            echo "run=no" >> "$GITHUB_OUTPUT"
          else
            echo "⚠ 回すもの（⚠ **$n 本を同時に回す**）:"
            echo "$matrix" | jq -r '.[] | "  --suite=\(.suite) --group=\(.group)"'
            echo "run=yes" >> "$GITHUB_OUTPUT"
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # ⚠ **suite ごとに、⚠ 別のジョブで同時に回す**（2026-08-22。hidetzu/konjaku#190）。
  #
  # ⚠ **なぜ suite ごとか。**⚠ **ケース単位ではなく。**
  #   ⚠ **実測（2026-08-22・手元・`main` = `bb4b0a1`）**: 外へ出る本数は suite で偏っている。
  #     top core   91 件 / 165.8s / 2,961 本 ＝ 17.9 本/秒
  #     peel core  67 件 / 187.9s / 6,845 本 ＝ 36.4 本/秒
  #     top search  9 件 /  58.0s /    26 本 ＝  0.4 本/秒
  #   ⚠ **いまの瞬間の最大は、⚠ peel の 36.4 本/秒**（直列なので 1 つずつ）。
  #   ⚠ **3 つ同時にしても 54.7 本/秒＝ 1.5 倍**（⚠ **3 倍にならない**。⚠ 偏っているから）。
  #   ⚠ **ケース単位で 4 並列にすると 146 本/秒＝ 4 倍。**⚠ **そちらは採らない。**
  #   ⚠ **総量は 9,832 本で変わらない。**⚠ **変わるのは瞬間の密度だけ。**
  #
  # ⚠ **もう 1 つの理由: 出力が混ざらない。**
  #   ⚠ ジョブが分かれるので、⚠ **落ちた suite のログがそのまま読める。**
  #   ⚠ **ケース単位で並べると、⚠ 落ちた理由が混ざる**（hidetzu/konjaku#190 の止まる条件）。
  #
  # ⚠ **代償として、⚠ ブラウザの用意が固まる機会がジョブの数だけ増える。**
  #   ⚠ **ただし、⚠ いまは固まっていない**（2026-08-22 に測り直した）。
  #   ⚠ **実測（直近 20 ジョブの「ブラウザと、その依存」の段）**:
  #     ⚠ **通った 20 回 ／ 落ちた 0 回。**⚠ 12 / 12 / 12 / 12 / 12 / 13 / 13 / 13 / 13 / 13 /
  #       14 / 14 / 14 / 15 / 16 / 16 / 18 / 19 / 22 / 35 秒（⚠ 中央値 14 秒）。
  #   ⚠ **2026-08-19 に測ったときは「上限に張り付く試行が約 40%」だった。**
  #     ⚠ **いまは当てはまらない。**⚠ **相手側（apt のミラー）の調子は時期による。**
  #   ⚠ **0 / 20 は「起きない」の証明ではない。**⚠ **取り直し 3 回は外さない。**
  #   ⚠ `fail-fast: false` にしてあるので、⚠ **1 本が固まっても、⚠ 残りは最後まで走る。**
  render-run:
    name: 実描画 ${{ matrix.name }}
    needs: render-plan
    if: needs.render-plan.outputs.run == 'yes'
    strategy:
      # ⚠ **1 本落ちても、⚠ 残りを止めない。**⚠ **どこまで壊れたかを知りたい。**
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.render-plan.outputs.matrix) }}
    # ⚠ **既定は 360 分（6 時間）。**実測（2026-08-18・成功した 11 回）: 5分54秒 〜 6分46秒。
    #   最長の約 3 倍を上限にする。
    # ⚠ **これは速さの制限ではなく、止まったまま気づかないのを防ぐもの。**
    #   同じ日に 3 回、`npx playwright install --with-deps` の段で固まった
    #   （71 分 / 25 分 / 22 分。いずれも人が気づいて止めた）。
    #   ⚠ そのときテストは 1 秒も走っていない。**落ちても自分の変更を疑わない。**
    #   ⚠ 上げるときは、何が遅くなったのかを実測してから。
    # ⚠ 2026-08-18 に 4 回目が出たので、**下でブラウザの用意を取り直す**ようにした。
    # ⚠ 2026-08-19 に 3 回続けて出たので、取り直しを 2 → 3 回に増やした。
    #   実測（直近 20 実行・「ブラウザと、その依存」の段）:
    #     通った試行  11 / 13 / 18 / 22 / 29 / 57 / 59 / 67 / 190 / 193 / 250 秒
    #     落ちた回    720 秒（＝ 360 × 2 回とも上限に張り付き）
    #   ⚠ **上限に張り付く試行が約 40%。**2 回だと 0.4² ＝ 16% で落ちる（実測とほぼ一致）。
    #     3 回なら 6.4%。
    # ⚠ **これは 2026-08-19 の実測。**⚠ **2026-08-22 に測り直したら 20 / 20 で通っていた**
    #   （12〜35 秒・中央値 14 秒）。⚠ **時期によって変わるので、⚠ 取り直しは外さない。**
    #   ⚠ **上限 360 秒は下げない。**250 秒かかって通った回がある。
    #   360 秒 × 3 回 ＝ 最大 18 分。
    #   ⚠ **1 本あたりの実描画は 3〜5 分**（⚠ 分ける前は 7〜9 分だった）。
    timeout-minutes: 32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
      # デプロイ側の npm ci を重くしたくないので、CIでだけ入れる。
      # ⚠ 版は x.y.z まで固定する。メジャーだけ書くと 1.x の最新に動くので、
      #   ある日ブラウザの挙動が変わって検査が落ちる（原因が自分の変更に見える）。
      #   上げるときは、上げたことが差分に出るようにする。
      # ⚠ **版の出どころは、上の env.PLAYWRIGHT_VERSION の1か所だけ。**
      #   入れる版とキャッシュのキーを別々に決めると、
      #   「別の版のブラウザを、この版のキーで拾う」がいつか起きる。
      - run: npm i --no-save playwright@${{ env.PLAYWRIGHT_VERSION }}
      # ⚠ ブラウザの用意に 36 秒かかっていた（実測 2026-08-15）。ジョブ全体 284 秒のうち
      #   これが 13%。中身は変わらないので、版が同じなら取り直す必要がない。
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ env.PLAYWRIGHT_VERSION }}
      # ⚠ **--with-deps を外してはいけない。** 一度外して実測した（2026-08-15）。
      #   ブラウザは起動したが、`行を押すと、寄った結果が画面に入る` が
      #   **2回とも同じ 53%** で落ちた（揺れではない）。
      #   apt が入れているのはライブラリだけでなく**フォント**でもあり、
      #   無いと文字の寸法が変わってレイアウトがずれる。
      #   375px の画面で「押した結果が見えているか」を測っている検査なので、そこに出た。
      #   ⚠ 速さのために外すと、**実描画が測っているもの自体が変わる**。
      # ⚠ **ここが固まる。** 実測: 2026-08-18 に 4 回目（71 分 / 25 分 / 22 分 / 19 分）。
      #   いずれも apt が `azure.archive.ubuntu.com` で無言になり、テストは 1 秒も走っていない。
      #   ⚠ 直前の行までログが出て、そこから何も出ない。**落ちても自分の変更を疑わない。**
      # ⚠ 上限つきで区切って、固まったら 1 回だけ取り直す。
      #   ⚠ **取り直した回数は必ず出す**（黙って直ると、頻度が分からなくなる）。
      #   ⚠ ジョブの timeout（32 分）より内側に収める。3 回 × 6 分 ＋ 実描画 3〜5 分 ＋ 余裕。
      - name: ブラウザと、その依存（フォント含む）
        run: |
          set -u
          for i in 1 2 3; do
            if timeout 360 npx playwright install --with-deps chromium; then
              # ⚠ `[ ] && echo` を最後に置かない。判定が偽のとき 0 以外で終わる
              if [ "$i" -gt 1 ]; then echo "⚠ ブラウザの用意を $i 回目で通した（1 回目は固まった）"; fi
              exit 0
            fi
            echo "⚠ ブラウザの用意が $i 回目で固まった（上限 360 秒）。取り直す"
            sudo pkill -f apt-get || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock-frontend || true
            sudo dpkg --configure -a || true
          done
          echo "⚠ 3 回とも固まった。これは相手側（apt のミラー）の問題で、この変更のせいではない"
          exit 1
      # ⚠ **core と search を分けているのは、速さではない。**
      #   ⚠ **落ちた原因を切り分けられるようにするため。**
      #     実測（2026-08-17）: 住所検索は速いとき 0.4 秒・遅いとき 8.2 秒。
      #     8 秒でアプリが中断する（掟のタイムアウト）ので、遅い回は
      #     **アプリが正しく中断したのに検査だけが落ちる**。
      #     core が落ちたら、それは外部のせいにできない＝こちらの不具合。
      #   ⚠ search 群は render.mjs が **1 回だけ**やり直す。やり直した回数は必ず出る。
      # ⚠ **走った suite と件数は、⚠ render.mjs が 1 行目で名乗る。**
      - name: ページが実際に描画されるか
        run: node test/render.mjs --suite=${{ matrix.suite }} --group=${{ matrix.group }} ${{ matrix.shard && format('--shard={0}', matrix.shard) || '' }}
      # ⚠ 成果物は**落ちたときだけ**残す（render.mjs が失敗時のみ撮る）。
      #   以前は 75 件すべて撮っていたのに、`.artifacts/` が隠しディレクトリで
      #   upload-artifact に除外され、**1枚も保存されていなかった**。
      #   拾えなかったことが分かるように、if-no-files-found は ignore にしない。
      # ⚠ **名前は suite ごとに変える。**⚠ 同じ名前で 2 本上げると衝突して落ちる。
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: failure()
        with:
          name: screenshots-${{ matrix.id }}
          path: artifacts/render/
          if-no-files-found: warn

  # ⚠ **門番。**⚠ **必須チェックの名前は、⚠ ここが持つ。**
  #   ⚠ **matrix のジョブは名前が `実描画 top/core` のように変わるので、⚠ 必須にできない。**
  #   ⚠ **`if: always()` にしないと、⚠ 上が落ちたときに報告が来ないまま永久に待ちになる。**
  #   ⚠ **fork の条件は上と同じにする。**⚠ 揃えないと、⚠ fork の PR で永久に待ちになる。
  render:
    name: 実描画
    needs: [render-plan, render-run]
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 実描画が全部通ったか
        env:
          PLAN: ${{ needs.render-plan.result }}
          RUN: ${{ needs.render-plan.outputs.run }}
          RESULT: ${{ needs.render-run.result }}
        run: |
          set -u
          echo "計画=${PLAN} ／ 回すか=${RUN} ／ 結果=${RESULT}"
          # ⚠ **計画そのものが立たなかったら落とす。**⚠ 黙って通さない
          if [ "${PLAN}" != "success" ]; then
            echo "⚠ 実描画の計画が立たなかった（${PLAN}）。⚠ 何を回すか決まっていない"
            exit 1
          fi
          # ⚠ **回さないと決めたときは通す**（画面にも実行環境にも届かない変更だけ）。
          #   ⚠ **これは「検査した」ではない。**⚠ **回す必要が無かった、という意味。**
          if [ "${RUN}" != "yes" ]; then
            echo "⚠ この変更では実描画を回していない（画面にも実行環境にも届かない）"
            echo "⚠ 静的検査は回っている"
            exit 0
          fi
          if [ "${RESULT}" != "success" ]; then
            echo "⚠ 実描画のどれかが通っていない（${RESULT}）"
            echo "⚠ どの suite かは、⚠ 上の「実描画 <suite>/<group>」を見る"
            echo "⚠ 「ブラウザの用意が N 回目で固まった」が出ていたら相手側（apt）。やり直す"
            exit 1
          fi
          echo "実描画は全部通った"


  # ⚠ **v0.1.0（`konjaku-next`）を出す**（2026-08-29。Owner 判断。`docs/adr/0070`）。
  #
  # ⚠ **β 版（`konjaku` / `public/`）には触らない。**⚠ 出すのは `wrangler.next.jsonc` だけ。
  #   ⚠ **`-c` を外すと、⚠ 既定の `wrangler.jsonc` が読まれて β 版が出る。**
  #   ⚠ **β 版には実際の利用者がいて、⚠ その観測の上に判断が乗っている**（`docs/adr/0047`）。
  #   ⚠ **β 版は Workers Builds が出している。**⚠ **ここは、⚠ そこへ一切関与しない。**
  #
  # ⚠ **なぜ Workers Builds に足さないか**（⚠ ADR 0050 の「今は足さない」を、⚠ こう覆した）:
  #   ⚠ **Cloudflare 側は、⚠ GitHub の検査の緑を待てない。**⚠ **赤のまま出る。**
  #   ⚠ **ここなら `needs:` で、⚠ 門番の後ろに置ける**（⚠ 下の 3 つが全部緑のときだけ走る）。
  #
  # ⚠ **`develop` への push でだけ走る。**⚠ **PR では走らない。**
  #   ⚠ **fork の PR に秘密を渡さない**（⚠ このリポジトリは public）。
  #   ⚠ `pull_request` には、⚠ そもそも secrets が渡らないが、⚠ 条件でも閉じておく。
  deploy-next:
    name: v0.1.0 を出す（konjaku-next）
    # ⚠ **門番 3 つの後ろ。**⚠ **`render` は `always()` の門番なので、⚠ 必ず結果を返す**
    #   （⚠ 返さない者を `needs` に置くと、⚠ ここが永久に待ちになる）。
    needs: [checks, search, render]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    # ⚠ **既定は 360 分。**⚠ 実測（2026-08-29・手元）: 照合は 17 ファイルで数秒。
    #   ⚠ **デプロイ本体が支配的。**⚠ 取り直しを 3 回入れても収まる長さにする。
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # ⚠ 認証情報を .git/config に残さない（⚠ 上のジョブと同じ）
          persist-credentials: false

      # ⚠ **版は上の env の 1 か所だけ**（⚠ `npx wrangler` だと、その日の最新が降る）。
      # ⚠ **`npm ci` を挟まない。**⚠ このリポジトリは依存ゼロで、⚠ wrangler は使い捨てで入れる
      #   （⚠ `npm ci` が通ること自体は、⚠ 上の「静的検査」のジョブが見ている）。
      - name: 出す（konjaku-next だけ）
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy -c wrangler.next.jsonc

      # ⚠ **「デプロイが成功した」は、⚠ 「出ている」ではない**（`CLAUDE.md` §1）。
      #   ⚠ **配った実体を取り直して、⚠ 手元と同じ中身かを見る**（sha256）。
      #
      # ⚠ **`/version.json` は使えない。**⚠ あれは β 版の仕組みで、⚠ `public-next/` は持たない
      #   （`docs/adr/0050`「引き継がない」）。⚠ **だから中身そのものを突き合わせる。**
      #
      # ⚠ **`?cb=<commit>` を外さない。**⚠ 付けないと、⚠ 端の古い写しを「いまの本番」と読みうる。
      # ⚠ **`-L` を外さない。**⚠ `/index.html` は `/` へ送られ、⚠ 本文が空で返る
      #   （⚠ 実測 2026-08-29: ⚠ **空文字の sha256 を「本番の中身」として読んでいた**）。
      # ⚠ **取れなかったときも、ここは「違う」に倒れる**（⚠ `curl` が落ちると空になる）。
      #   ⚠ **それでよい。**⚠ **取れなかったことを「出ている」と言わないため**（`CLAUDE.md` §1）。
      - name: 出たものが、手元と同じか（sha256・全ファイル）
        env:
          ORIGIN: ${{ env.NEXT_ORIGIN }}
          SHA: ${{ github.sha }}
        run: |
          set -u
          files=$(cd public-next && find . -type f | sed 's|^\./||' | sort)
          n=$(echo "$files" | wc -l | tr -d ' ')
          if [ -z "$files" ]; then
            echo "⚠ public-next/ にファイルが 1 つも無い（⚠ この照合は何も見ていない）"
            exit 1
          fi
          echo "照合する: $n ファイル（$ORIGIN）"
          for try in 1 2 3; do
            ng=""
            for f in $files; do
              want=$(sha256sum "public-next/$f" | cut -d' ' -f1)
              got=$(curl -fsSL --max-time 30 "$ORIGIN/$f?cb=$SHA" | sha256sum | cut -d' ' -f1)
              if [ "$want" != "$got" ]; then ng="$ng $f"; fi
            done
            if [ -z "$ng" ]; then
              echo "$n ファイルとも一致した（$ORIGIN は、この commit の public-next/ と同じ）"
              exit 0
            fi
            echo "⚠ $try 回目で違ったもの:$ng"
            # ⚠ `[ ] && …` を最後に置かない（⚠ 上のジョブと同じ踏み方）
            if [ "$try" -lt 3 ]; then echo "15 秒待って取り直す"; sleep 15; fi
          done
          echo "⚠ 3 回とも違った。⚠ **出したはずのものが、⚠ 届いていない**"
          echo "⚠ 伝播の遅れではないかもしれない。⚠ Cloudflare 側で中身を書き換える設定"
          echo "⚠ （HTML の最小化・スクリプトの差し込み）が入っていないかを見る"
          exit 1
