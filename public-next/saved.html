<!-- 保存した場所の一覧。深掘りの入口。
     板（地図の上）と違って URL を持つので、/deep から戻ってこられる。
     地図は持たない。ここでやることは「次に読む 1 件を選ぶ」だけ。 -->
<header class="brand">
  <a class="brand__name" href="./">
    <img class="brand__mark" src="./favicon.svg" alt="" width="20" height="20">
    <span class="brand__title">今昔</span><span class="brand__tag">この土地は、昔なんだったのか？</span>
  </a>
  <details class="menu">
    <summary class="menu__btn" aria-label="メニュー">
      <span class="menu__bars" aria-hidden="true"></span>
    </summary>
    <nav class="menu__panel" aria-label="サイトの案内">
      <a class="menu__item" href="./about.html">このサイトについて</a>
      <a class="menu__item" href="./privacy.html">プライバシーポリシー</a>
      <a class="menu__item" href="./terms.html">利用規約</a>
    </nav>
  </details>
</header>

<main class="list" id="list">
  <h1 class="list__h">保存した場所<span class="list__n" id="listN"></span></h1>

  <!-- 受け取り口から来たとき、何が起きたかを言う（押したのに無言にしない）。 -->
  <p class="list__said" id="listSaid" hidden></p>

  <ol class="list__items" id="listItems"></ol>

  <!-- 1 件も無いとき。空白にしない。何をすれば並ぶかを言う。 -->
  <section class="list__empty" id="listEmpty" hidden>
    <h2 class="list__emptyH">まだ 1 件も保存していません</h2>
    <p class="list__emptyP">地図で場所を決めて「☆ 保存」を押すと、ここに並びます。
      別の端末で保存したものは、合言葉で受け取れます。</p>
  </section>

  <p class="list__note" id="listNote" hidden>この端末の中だけに残ります。どこにも送りません。</p>
</main>
<!-- 下の帯。主な行き先は 2 つだけ（地図と保存した場所）。
     深掘りは場所を選んでから決まるので、ここには置けない（行き先が定まらない）。
     案内（このサイトについて・プライバシー・利用規約）は名乗りのメニューが持つ。 -->
<nav class="tabs" aria-label="主な行き先">
  <div class="tabs__inner">
  <a class="tabs__item" href="./">

    </svg>
    <span>地図</span>
  </a>
  <a class="tabs__item" href="./saved.html" aria-current="page">

    </svg>
    <span>保存した場所</span>

  </div>
</nav>
