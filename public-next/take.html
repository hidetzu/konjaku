<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>保存した場所を受け取る — 今昔</title>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./brand.css">
<link rel="stylesheet" href="./foot.css">
<link rel="stylesheet" href="./top.css">
<link rel="stylesheet" href="./take.css">

<!-- 合言葉を打って、別の端末で保存した場所を受け取る画面。
     地図には重ねない。他に押すものが無いので、専用のページのほうが迷わない。
     受け取ったあとの見せ方は、散歩中の画面と同じ形にそろえてある。
       見せる → 押してもらう → 足す。開いた瞬間には混ぜない。 -->
  <!-- 名乗り。アプリのトップへ行く道でもある。
       この画面はリンクで直接ひらかれるので、その端末ではトップを一度も見ていない。
       だから history.back() は使えないし、「戻る」とも言えない。 -->
  <header class="brand">
    <div class="brand__inner">
      <a class="brand__name" href="./">
        <img class="brand__mark" src="./favicon.svg" alt="" width="20" height="20">
        <span class="brand__words"><span class="brand__title">今昔</span><span class="brand__tag">この土地は、昔なんだったのか？</span></span>
      </a>
      <nav class="brand__nav" aria-label="主な行き先">
        <a class="brand__link" href="./">地図で調べる</a>
      </nav>
      <details class="menu">
        <summary class="menu__btn" aria-label="メニュー">
          <span class="menu__bars" aria-hidden="true"></span>
        </summary>
        <nav class="menu__panel" aria-label="サイトの案内">
          <a class="menu__item" href="./about.html">このサイトについて</a>
          <a class="menu__item" href="./privacy.html">プライバシーポリシー</a>
          <a class="menu__item" href="./terms.html">利用規約</a>
          <a class="menu__item" href="https://github.com/hidetzu/konjaku/issues/new?template=feedback.yml" target="_blank" rel="noopener">ご意見・不具合報告（GitHub で公開）</a>
        </nav>
      </details>
    </div>
  </header>

<main class="recv" id="recv">
  <h1 class="recv__h">保存した場所を受け取る</h1>
  <p class="recv__lead" id="recvLead">スマホの画面に出ている合言葉を入れてください。</p>

  <form class="recv__form" id="recvForm">
    <input class="recv__in" id="recvIn" type="text" inputmode="latin"
           autocomplete="off" autocapitalize="characters" spellcheck="false"
           aria-label="合言葉" placeholder="合言葉">
    <button class="recv__go" id="recvGo" type="submit">受け取る</button>
  </form>
  <!-- 押したあとに何が起きたかを、必ず字で言う。 -->
  <p class="recv__said" id="recvSaid" hidden></p>

  <!-- 受け取れなかったとき。できることから書く。
       1 行目と手順は、期限切れでも打ち間違いでも同じ。やることが同じだから。
       違うのは理由の 1 行だけ。 -->
  <section class="recv__again" id="recvAgain" hidden>
    <p class="recv__can">スマホで出し直すと、すぐ受け取れます。</p>
    <ol class="recv__steps">
      <li><span class="recv__sn">1</span><span>スマホの「保存した場所」から
        「PC やタブレットでも見る」を押す</span></li>
      <li><span class="recv__sn">2</span><span>出てきた 8 文字を、ここに入れる</span></li>
    </ol>
    <p class="recv__why" id="recvWhy"></p>
  </section>

  <!-- 置けなかったとき。ここに留まる。 -->
  <section class="recv__card" id="recvGot" hidden>
    <h2 class="recv__got" id="gotTitle">　</h2>
    <p class="take__body" id="gotBody"></p>
  </section>

  <p class="recv__hint" id="recvHint">合言葉は、スマホの「保存した場所」から
    「PC やタブレットでも見る」を押すと出ます。</p>
</main>
<!-- ページの下の案内。広い幅だけが持つ（狭い幅の下は、行き先の帯が使う）。
     持つのは名乗りのメニューと同じ 4 つ。広い幅ではメニューを畳むので、
     ここが欠けると案内へ行けなくなる。
     地図・保存の導線はここに置かない。それは上の帯が持つ。 -->
<footer class="foot">
  <nav class="foot__nav" aria-label="サイトの案内">
    <a class="foot__link" href="./about.html">このサイトについて</a>
    <a class="foot__link" href="./privacy.html">プライバシーポリシー</a>
    <a class="foot__link" href="./terms.html">利用規約</a>
    <a class="foot__link" href="https://github.com/hidetzu/konjaku/issues/new?template=feedback.yml"
       target="_blank" rel="noopener">ご意見・不具合報告（GitHub で公開）</a>
  </nav>
</footer>
