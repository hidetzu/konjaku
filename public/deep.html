<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- URL に地名と座標が載る。押した先へ Referer で渡さない。
     _headers と二重にしてある。片方が効かない配信経路があっても漏らさないため。

     no-referrer ではなく same-origin。外へは一切送らないのは同じだが、
     こちらは同じサイトの中では残る。/deep が「どこから来たか」を読み、
     「← ひとつ前へ」を出すのに要る（back.js）。
     no-referrer にしたら、同じサイトから来ても直前へ返せなくなった。 -->
<meta name="referrer" content="same-origin">
<title>この場所を深掘りする — 今昔</title>
<meta name="description" content="選んだ場所を深掘りします。空中写真の年代差、成り立ちと起こりうること、この一帯はどうだったか、近くに残る災害の記録。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="今昔">
<meta property="og:title" content="この場所を深掘りする — 今昔">
<meta property="og:description" content="選んだ場所を深掘りします。空中写真の年代差、成り立ちと起こりうること、この一帯はどうだったか、近くに残る災害の記録。">
<meta property="og:url" content="https://konjaku.hidetzu.work/deep">
<meta property="og:image" content="https://konjaku.hidetzu.work/ogp.png">
<meta property="og:image:alt" content="この土地は、昔なんだったのか？ — 土地の成り立ちを、根拠とともに見る">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="この場所を深掘りする — 今昔">
<meta name="twitter:description" content="選んだ場所を深掘りします。空中写真の年代差、成り立ちと起こりうること、この一帯はどうだったか、近くに残る災害の記録。">
<meta name="twitter:image" content="https://konjaku.hidetzu.work/ogp.png">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<script src="./theme.js"></script>
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./brand.css">
<link rel="stylesheet" href="./foot.css">
<link rel="stylesheet" href="./deep.css">

<!-- 帰宅後に、保存した 1 地点を読む画面。
     散歩中の画面（/）とは、問いも時間も違う。
       散歩中  ここは昔なんだった？  5 秒   地図が主役
       帰宅後  なぜこうなった？      10 分  読み物
     上から順に「いつ → まわり → なぜ」で読み下す。タブを並べない。 -->
  <!-- 名乗り。アプリのトップへ行く道。どの入口から来ても、ここから / へ行ける。 -->
  <header class="brand">
    <div class="brand__inner">
      <a class="brand__name" href="./">
        <img class="brand__mark" src="./favicon.svg" alt="" width="20" height="20">
        <span class="brand__words"><span class="brand__title">今昔</span><span class="brand__tag">この土地は、昔なんだったのか？</span></span>
      </a>
      <details class="theme" id="theme" hidden>
        <summary class="theme__btn" aria-label="色みを選ぶ">
          <svg class="theme__icon" viewBox="0 0 24 24" width="20" height="20"
               aria-hidden="true" focusable="false"></svg>
        </summary>
        <div class="theme__panel" role="group" aria-label="色み">
          <button class="theme__item" type="button" data-v="auto" aria-pressed="true">端末に合わせる</button>
          <button class="theme__item" type="button" data-v="light" aria-pressed="false">明るい</button>
          <button class="theme__item" type="button" data-v="dark" aria-pressed="false">暗い</button>
        </div>
      </details>
      <details class="menu">
        <summary class="menu__btn" aria-label="メニュー">
          <span class="menu__bars" aria-hidden="true"></span>
        </summary>
        <nav class="menu__panel" aria-label="サイトの案内">
          <a class="menu__item" href="./about">このサイトについて</a>
          <a class="menu__item" href="./privacy">プライバシーポリシー</a>
          <a class="menu__item" href="./terms">利用規約</a>
          <a class="menu__item" href="https://github.com/hidetzu/konjaku/issues/new?template=feedback.yml" target="_blank" rel="noopener">ご意見・不具合報告（GitHub で公開）</a>
        </nav>
      </details>
    </div>
  </header>

<article id="doc">
  <header id="head">
    <!-- 直前へ返す道。入口が 3 つある（地図・保存の一覧・共有リンク）ので、
         行き先を名指しできない。同じサイトから来たときだけ「ひとつ前へ」と言う。
         直接ひらいた人には、行き先を言う字にする（deep.js が決める）。 -->
    <a class="back" id="back" href="./">この場所を地図で見る</a>
    <p class="place" id="place">　</p>
    <!-- 答えの出典。散歩中の画面と同じ形にする。
         前は、同じ場所でトップが「ここは 田 でした」、こちらが
         「ここは、川や海が…」で、2 つの画面が別の答えを見出しにしていた。 -->
    <p class="ans__src" id="glossSrc" hidden></p>
    <h1 class="ans" id="gloss">　</h1>
    <p class="ans__sub" id="glossSub" hidden></p>
    <p class="term" id="term"></p>
  </header>

  <!-- 主役は「どう変わったか」。時間の流れを、いちばん先に見せる。 -->
  <section class="sec" id="timeSec" hidden>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5h4v6H2zM7 5h4v6H7zM12 5h2v6h-2z"/><path d="M1 3h14M1 13h14"/></svg><span>どう変わったか</span></h2>
    <p class="time__lead" id="timeLead"></p>
    <div class="frames" id="frames"></div>
    <p class="time__note" id="timeNote"></p>
  </section>

  <section class="sec" id="whySec">
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 5h14M1 9h14M1 12.5h14"/><path d="M4 5c2-2 6-2 8 0"/></svg><span>なぜこうなった</span></h2>
    <div class="why" id="why"></div>
  </section>

  <!-- この一帯の地盤と揺れ（J-SHIS）。
       この地点そのものの話なので、分離の線（sec--around）より上に置く。
       微地形と揺れの見込みは、因果でつながない。別々の項目として並べる。
       実測（2026-09-02）で、同じ埋立地でも震度6弱以上が 12.9% / 20.3% / 35.6% と
       3 倍近く違った。揺れの見込みは、その土地の地盤だけで決まらない。 -->
  <section class="sec" id="groundSec" hidden>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1 8h2.5l2-4 2.5 8 2-6 1.5 2H15"/></svg><span id="groundH"></span></h2>
    <p class="ground__scope" id="groundScope"></p>
    <div class="why" id="ground"></div>
    <p class="why__from" id="groundFrom"></p>
    <p class="ground__note" id="groundNote"></p>
  </section>

  <!-- この先で、土地が変わる（2026-09-05。v0.3.0）。
       読んだ人が、この答えを足で確かめられる唯一の場所。
       この地点そのものの話なので、分離の線（sec--around）より上に置く。
       ⚠ 出すのは 1 地点だけ。別の場所を探す画面にはしない。
       ⚠ 地形分類が無い土地では、節ごと出さない（2026-09-05）。 -->
  <section class="sec border" id="borderSec" hidden>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M1.5 11c2-3 4-1 5.5-3.5S10.5 3 14.5 4"/><path d="M1.5 14.5h13"/></svg><span id="borderH"></span></h2>
    <p class="border__line" id="borderLine"></p>
    <p class="border__go">
      <span class="border__dir" id="borderDir" aria-hidden="true"></span>
      <span class="border__body">
        <span class="border__to" id="borderTo"></span>
        <span class="border__far" id="borderFar"></span>
      </span>
    </p>
    <p class="border__note" id="borderNote"></p>
    <p class="why__from" id="borderFrom"></p>
  </section>

  <section class="sec" id="nearSec" hidden>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M2 2h12v12H2z"/><path d="M6 2v12M10 2v12M2 6h12M2 10h12"/><circle cx="8" cy="8" r="1.6" fill="currentColor" stroke="none"/></svg><span>この一帯は、どうだったか</span></h2>
    <div class="around" id="around" hidden>
      <p class="around__lead" id="aroundLead"></p>
      <ul class="shares" id="shares"></ul>
      <p class="around__note" id="aroundNote"></p>
    </div>
    <p class="near__lead" id="nearLead"></p>
    <ol class="years" id="years"></ol>
    <p class="near__note" id="nearNote"></p>
    <p class="near__from" id="nearFrom"></p>
  </section>

  <!-- 近くに残る災害の記録。散歩中の画面には出さない。
       伝承碑は全国にあるが、現在地の近くに出せるほど密ではなかった
       （実測: 半径 1km で 15 地点中 0 件）。帰宅後に読む画面でだけ扱う。

       この地点の履歴ではない。まわりに残っている記録なので、一段下げて分ける
       （2026-09-01。仮想利用者 6 名のうち 2 名が「その地点そのものの履歴ではないので、
       見た目でも分離されていた方が安心」「碑は優先度が低い」と答えた）。
       重要な情報（答え・写真・成り立ち・一帯）より下に置く。 -->
  <section class="sec sec--around" id="monSec" hidden>
    <p class="sec__kind">ここから下は、この地点そのものではなく、まわりに残っている記録です</p>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14V4a2 2 0 0 1 4 0v10"/><path d="M3.5 14h9"/><path d="M6.8 7h2.4"/></svg><span>この近くに残る災害の記録</span></h2>
    <p class="mon__lead" id="monLead"></p>
    <ol class="mon" id="mon"></ol>
    <p class="mon__cite" id="monCite" hidden></p>
  </section>


  <section class="sec" id="readSec" hidden>
    <h2><svg class="sec__icon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 2.5h7l3 3v10H3z"/><path d="M9.6 2.5v3.2H13"/><path d="M5.5 9h5M5.5 11.5h5"/></svg><span>この画面が読んだ資料</span></h2>
    <dl class="read" id="read"></dl>
  </section>

</article>
<!-- ページの下の案内。広い幅だけが持つ（狭い幅の下は、行き先の帯が使う）。
     持つのは名乗りのメニューと同じ 4 つ。広い幅ではメニューを畳むので、
     ここが欠けると案内へ行けなくなる。
     地図・保存の導線はここに置かない。それは上の帯が持つ。 -->
<footer class="foot">
  <nav class="foot__nav" aria-label="サイトの案内">
    <a class="foot__link" href="./about">このサイトについて</a>
    <a class="foot__link" href="./privacy">プライバシーポリシー</a>
    <a class="foot__link" href="./terms">利用規約</a>
    <a class="foot__link" href="https://github.com/hidetzu/konjaku/issues/new?template=feedback.yml"
       target="_blank" rel="noopener">ご意見・不具合報告（GitHub で公開）</a>
  </nav>
</footer>
