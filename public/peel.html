<!-- ⚠ 2 画面で共通の見た目の定義。**ここが唯一の出どころ**（ADR 0021）。
     ⚠ 画面ごとに値が違うものは、下の <style> に残してある。 -->
<link rel="stylesheet" href="./css/tokens.css">
<style>
  /* 色の意味は index.html と同じ。⚠ 値だけ違う（地図の上なので、面はより暗い）。
     名前を揃えてあるので、テーマを足すときは両方に同じ名前で書けばよい。 */
  :root{
    --bg:#080b0f;
    --surface:rgba(12,16,22,.84);
    --line:rgba(255,255,255,.13);
    --ink:#eef1f5;
    --ink-dim:#8e99a6;

    /* 文字の大きさ。⚠ 名前も段も index.html と揃える。
       二層にしてあり、**値は --text-* にしか書かない**。使う側は --fs-* を書く。
       理由と実測は index.html の同じ節に全文がある。 */
    /* ⚠ ここから下は index.html に無い段。3D は数字そのものが主役なので大きい。 */
    --text-4xl:1.375rem;         /* 数字を出せないときの、ヒーローの代わりの文 */
    --text-hero:2.375rem;
    --text-hero-fit-max:11.5vw;
    --text-ruler-year:1.875rem;
    --text-ruler-arrow:1.25rem;
    --text-chevron:1.0625rem;

    --fs-chevron:var(--text-chevron);        /* 但し書き */
    /* ⚠ 入力欄は 16px 未満にしない。iOS Safari は 16px 未満の入力欄に触れると
       ページごと拡大し、戻らない。index.html と同じ約束（見た目の都合で下げないこと）。 */
    --fs-hero-sm:var(--text-4xl);    /* 数字を出せないとき（「判定できません」） */
    --fs-hero:var(--text-hero);      /* 99.6% と年。この画面の主役 */
    /* ⚠ 狭い幅で年代を 1 行に収めるための大きさ。2 行に割れると 38px 損して、
         そのぶん地図が減る（実測 2026-08-19・320幅で画面の 82% が箱になっていた）。
       ⚠ 生の値をここ以外に書かない（--text-* と --fs-* の決まり）。 */
    --fs-hero-fit:min(var(--text-hero), var(--text-hero-fit-max));
    --fs-ruler-year:min(var(--text-ruler-year), 9vw);
    --fs-ruler-arrow:var(--text-ruler-arrow);
  }
  *{box-sizing:border-box}
  /* ⚠ **「なぜそう言える？」で開く**（2026-08-22。Owner 判断: ⚠ 詳細はドリルダウン）。
     ⚠ **畳んでよいのは「実測」の行だけ**（判断は `prov.js` の `section`）。
     ⚠ **畳んだ中身は innerText に出ない＝画面にも出ない**ので、
       ⚠ **「取れなかった」「未対応」「推定」は、⚠ 畳まない側に置いてある。**
     ⚠ 押せる的は 44px を割らない（`.claude/rules/css.md`）。 */
  /* ⚠ **補足情報**（2026-08-22）。⚠ 中身が両方空なら、⚠ **節ごと出さない。** */
  /* ⚠ **目には出さないが、⚠ 読み上げと innerText には残す**（2026-08-22）。
     ⚠ `display:none` / `visibility:hidden` にしない（⚠ 読み上げから消える）。 */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;
    overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap;border:0}
  /* ⚠ **補足情報は節。⚠ 他の節と同じ区切りを持つ**（2026-08-22）。
     ⚠ 実測: `.sec` は上に 1px rgba(255,255,255,.13) を持つが、⚠ **ここだけ持っていなかった。**
     ⚠ **地名の下には引かない。**⚠ 地名は節ではなく、⚠ **パネル全体の主語**（17px w600）。
       ⚠ 線を引くと、⚠ 「地名」という節ができてしまう。 */
  /* ⚠ **補足情報は「差し込み」。⚠ 上下で囲む**（2026-08-22）。
     ⚠ **上だけだと、⚠ 補足情報と最初の問いがひと組に読める**（⚠ 下が開いているため）。
     ⚠ **問いには線を付けない。**⚠ 付けると問いまで「節」になり、⚠ 短い板に線が 4 本並ぶ。
       ⚠ **問いは本文で、⚠ 補足情報は本文に差し込まれた断り。**⚠ 格が違う。 */
  .sec-note{margin:12px 0;padding:12px 0;
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    display:flex;align-items:flex-start;gap:8px}
  .sec-note > ul{flex:1;min-width:0}
  /* ⚠ **? は的として 44×44**（`rules/css.md`）。⚠ 見た目の丸は中に描く。 */
  .note-help{flex:none;width:var(--tap);height:var(--tap);
    display:inline-flex;align-items:center;justify-content:center;
    background:none;border:0;color:var(--ink-dim);font-size:var(--fs-body);line-height:1;
    cursor:pointer}
  .note-help > span[aria-hidden]{display:inline-flex;align-items:center;justify-content:center;
    width:22px;height:22px;border:1px solid var(--line);border-radius:50%}
  .note-help[aria-expanded="true"]{color:var(--ink)}
  /* ⚠ **字間は 0.08em**（2026-08-22）。⚠ 大きさは `.sec>.label`（出典）と同じまま。
     ⚠ 実測: 12px に 0.15em で、⚠ **「補 足 情 報」と読めていた**
       （⚠ 和文の 4 字ラベルに、⚠ 欧文の SMALL CAPS 的なトラッキングは効かない）。
     ⚠ **出典側も同時に直す。**⚠ 片方だけだと、⚠ 同じ役割の見出しが 2 通りになる。 */

  /* ⚠ **補足は、⚠ どれも同じ形**（2026-08-22。Owner 判断）。
     ⚠ **推定であることは「推定です」という字が言う。**⚠ 色は補助で、⚠ 無くても意味は消えない。
     ⚠ **印を片方だけに付けない。**⚠ 付けると「もう片方は違う種類だ」と読ませることになる
       （⚠ 並んでいるのは 断り と ヒント で、⚠ どちらも「補足」）。
     ⚠ **推定のオレンジは、⚠ 深掘りの中の `.prov.est` が持っている。** */
  #notes{margin:0;padding:0;list-style:none}
  /* ⚠ **印は「・」**（2026-08-22。Owner 判断）。⚠ **和文の標準。**
     ⚠ **`-` は語をつなぐ記号**で、⚠ 箇条書きの記号ではない（12px の灰色だとゴミに見える）。
     ⚠ **印は要る。**⚠ 実測（2026-08-22・4 幅とも）: ⚠ **1 行目は 2 行に折り返す。**
       ⚠ 印が無いと、⚠ **2 行目が次の項目に見える。**⚠ ぶら下げで受ける。 */
  #notes li{position:relative;padding-left:1em;
    font-size:var(--fs-note);color:var(--ink-dim);line-height:1.6}
  #notes li::before{content:"・";position:absolute;left:0}
  /* ⚠ **色は意味を持つ**（2026-08-22）。⚠ この画面では
       `--estimate` ＝ 推定 ／ `--action` ＝ 押せる ／ `⚠` ＝ 災害リスク。
     ⚠ **`.k` は「意味の語」。**⚠ 元から `#est .k` として規則があったが、
       ⚠ hidetzu/konjaku#158 以降、⚠ **誰も使っていない死にコードだった。**⚠ 使う側を戻す。
     ⚠ **語だけに色を付ける。**⚠ 行ごと飾らない
       （⚠ 飾ると「この行は特別な種類だ」と読ませ、⚠ 隣の行との違いが意味に見える）。
     ⚠ **ヒントには `--action` を使わない。**⚠ あれは「押せる」の色で、
       ⚠ **この字は押せない。**⚠ 付けると押せると読まれる（ADR 0026）。 */
  #notes li b{color:var(--ink);font-weight:600}
  #notes li .k{color:var(--estimate);font-weight:600}
  /* ⚠ 1 つも無ければ、⚠ 節ごと出さない（⚠ 空の枠を置かない） */
  .sec-note:not(:has(#notes li)){display:none}
  /* ⚠ **「光らせる」は PC でも 44 を割らない**（`.claude/rules/css.md`）。
     ⚠ 実測（2026-08-22・1280×800）: ⚠ **220×27**。⚠ 狭い幅では 44 あった（PC だけ割れていた）。 */
  .peek{min-height:var(--tap)}
  .drill{margin-top:6px}
  .drill>summary{display:flex;align-items:center;gap:6px;min-height:var(--tap);
    cursor:pointer;color:var(--action);font-size:var(--fs-note);list-style:none}
  .drill>summary::-webkit-details-marker{display:none}
  .drill>summary::before{content:"▸";display:inline-block;transition:transform .15s}
  .drill[open]>summary::before{transform:rotate(90deg)}
  /* ⚠ **html に font-size を書かない**（2026-08-20）。トップと同じ理由。
     ⚠ 0.875rem × 既定 16px = 14px で、いままでと同じ大きさ。 */
  html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden}
  body{font:0.875rem/1.6 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
  #map{position:absolute;inset:0;transition:filter .25s linear}
  #vig{position:absolute;inset:0;z-index:3;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
  #grade{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
    background:linear-gradient(180deg,rgba(20,60,110,.18),rgba(10,35,70,.42));mix-blend-mode:multiply}

  /* ============ HUD ============ */
  /* ⚠ 下の余白は、地図の帰属表示（国土地理院・OpenStreetMap）の場所。実測 24px ＋ 2px。
     ⚠ **負の margin で板を下げて相殺しない。** 一度そうして、板が帰属表示に 12px 食い込んだ
       （2026-08-17）。空けた場所に何かを戻せば、空けた意味が無くなる。 */
  /* ⚠ **下から伸びる箱は、答えの板を押しのけない。**
       実測（2026-08-19・320×480）: #hud が #land に 92px 食い込み、「99.6%」の 4 文字しか
       読めなかった。⚠ 画面が低いほど、いちばん強い実測が消える作りだった。
     ⚠ 上限を掛けて、超える分は中でスクロールさせる。⚠ **消さない・畳まない。** */
  /* ⚠ **箱の下端を、⚠ 帰属表示より上に置く**（2026-08-21。hidetzu/konjaku#152）。
     ⚠ 前は `bottom:0` ＋ `padding-bottom:26px` で、⚠ **中身が入りきるあいだは**
       帰属表示に届かなかった。⚠ 上限を掛けて中でスクロールするようになると、
       ⚠ **箱の下端まで中身が来る**ので、⚠ 帰属表示（高さ 24px）に重なった
       （⚠ 実測 320×640: `#timePanelBody` y525–647 が 帰属 y616–640 と重なった）。
     ⚠ **出典明示は利用の条件。**⚠ 覆わない。 */
  #hud{position:absolute;left:0;right:0;bottom:26px;z-index:12;pointer-events:none;
    padding:0 26px 0;display:flex;flex-direction:column;align-items:center;gap:13px;
    /* ⚠ **地図中央を、⚠ 下から伸びる箱が侵さない**（2026-08-21。hidetzu/konjaku#152。Owner 判断）。
       ⚠ **見た目の調整ではなく、⚠ レイアウトの契約**として置く。
         ⚠ 予約しているのは「⚠ **中央線 ＋ 20px**」であって、⚠ 「半分」という見た目ではない。
         ⚠ 中央は**調べている地点**（地図の印がある場所）。⚠ そこを覆うと、
           ⚠ **何を調べているのかが見えなくなる。**

       ⚠ **経緯**: 前は答えの板（#land）の高さ（--land-h）を JS が測って空けていた。
         ⚠ 2026-08-21 に `#land` を消した（Owner 判断）ので、⚠ **空ける相手が無くなり、
           ⚠ 上限が 130px ぶん緩んだ。**
         ⚠ 実測（豊洲・過去の段・SW 無効・2026-08-21）: ⚠ **3 幅で中央を覆った。**
           320×480  HUD 上端 99 ／ 中央 240   ⚠ 141px 覆う
           320×640  HUD 上端 259 ／ 中央 320  ⚠ 61px 覆う
           375×667  HUD 上端 306 ／ 中央 334  ⚠ 28px 覆う
           344×882  上端 501 ／ 中央 441      覆わない
           1280×800 上端 437 ／ 中央 400      覆わない

       ⚠ **潰さない。**⚠ 入りきらない分は中でスクロールさせる（⚠ 消さない・畳まない）。
         ⚠ 実測（2026-08-19）: 上限だけ掛けて 129px の中身が 27px になった記録がある。
         ⚠ 今回は狭い画面でも 220px 残る（320×480）。
       ⚠ **固定値で避けない**（CLAUDE.md §9）。⚠ 中央線から引いている。 */
    /* ⚠ **予約しているのは「中央線 ＋ 20px」**（⚠ 見た目の「半分」ではない）。
       ⚠ 箱の下端は帰属表示のぶん 26px 上がっているので、⚠ **その 26px も引く。**
         ⚠ 引かないと、⚠ 上限いっぱいのとき箱の上端が中央より上に来る
         （⚠ 実測 320×640: 上端 314 / 中央 320。⚠ 6px 侵した）。 */
    max-height:min(calc(100dvh - 62px - 20px), calc(50dvh - 20px - 26px));
    overflow-y:auto;overscroll-behavior:contain}
  /* ⚠ **潰さない。**⚠ 上限に当たったら、⚠ **縮めるのではなく中でスクロールさせる。**
     ⚠ 実測で踏んだ（2026-08-21・320×640）: 上限だけ掛けたら flex の子が縮み、
       ⚠ **`#hud` の中身が 381 → 300px に潰れ、⚠ スクロールもできず
       ⚠ 「空中写真 8 段 ／ 明治期は地図」が読めなくなった**（⚠ scrollHeight == height）。
     ⚠ コードに前から書いてある警告と同じ形（⚠ 129px の中身が 27px になった記録）。 */
  #hud > *{flex:none}
  /* ============ 土地の答え（常時見える） ============ */
  /* ⚠ 年代（60px）より小さく、但し書き（12px）より大きい。この画面の中心の主張。
     ⚠ **画面の上に置く。** 下の HUD に足すと、板のぶんだけ HUD が上へ伸び、
       実測（2026-08-16 / 375×667）で **画面中央 y=333 ＝ いま調べている地点そのもの**が
       板の下に隠れた（HUD の上端 354 → 280）。中央を空けるには追加分を 21px 未満に
       抑えるしかなく、3 行の板では不可能。だから上へ置く。
     ⚠ 右上のズーム操作と重ねない。幅を空けてある（下の right の値）。
     ⚠ 数字だけを置かない。**何の割合か**と**分母**を同じ板に出す（掟: 数字は主張範囲の分母で書く）。 */
  /* ⚠ **答えの板（#land）の見た目は消した**（2026-08-21。hidetzu/konjaku#152）。
     ⚠ 一緒に消したもの:
       ⚠ `body.picking #land`（hidetzu/konjaku#155。⚠ 押しているあいだ退かせていた）
       ⚠ `.land-added`（hidetzu/konjaku#150。⚠ 開いて増えた層の印。⚠ 要約が前提だった）
       ⚠ `#panel.open ~ #land`（⚠ パネルを広げたら隠す）
     ⚠ **層の見た目（.land-line 以下）は残す。**⚠ パネルが使っている。 */
  .land-line{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
  /* ⚠ **答えの数字。**⚠ **`.land-num`（%）と `.land-alt`（件数）は同じ大きさ**
     （2026-08-23。Owner 判断。⚠ **小さいほう＝もとの「件数」に寄せた**）。
     ⚠ **どちらもその問いの答えなので、⚠ 片方だけ大きいと重みが違って見える。**
     ⚠ **`small`（%）を数字より大きくしない。** */
  .land-num,
  .land-alt{font-size:var(--fs-badge);font-weight:600;line-height:1.35;color:var(--ink);
    font-variant-numeric:tabular-nums}
  .land-num small{font-size:var(--fs-badge);margin-left:1px}
  .land-what{font-size:var(--fs-note);line-height:1.5;color:#cbd3dc}
  .land-what b{color:var(--water);font-weight:600}
  .land-den{margin-top:3px;font-size:var(--fs-note);line-height:1.5;color:var(--ink-dim)}
  .land-den b{color:#cbd3dc;font-weight:600}
  .land-sub{margin-top:2px;font-size:var(--fs-note);line-height:1.5;color:var(--ink-faint)}
  /* 層。⚠ **確実性の高い順に積む**（ADR 0030）。⚠ 層の名前は「その層の問い」 */
  /* ⚠ **問いのあいだに区切りを入れる**（2026-08-22。Owner 判断）。
     ⚠ **先頭の問いには入れない**（⚠ すぐ上に補足の囲みの下線がある。⚠ 線が 2 本並ぶ）。 */
  .land-layer+.land-layer,.land-layer+.land-miss,.land-miss+.land-layer{
    margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
  /* ⚠ 第1層は主語つき。値だけ強く（docs/DOMAIN.md §2-1） */
  .land-g1{font-size:var(--fs-note);color:var(--ink-dim)}
  .land-g1 b{font-size:var(--fs-lead);color:var(--ink);font-weight:600}
  /* ⚠ **3 つの問いは、⚠ 画面の見出し（h1「この場所を深掘り」）と同じ大きさ**
       （2026-08-22。Owner 判断: ⚠ **小さいと見出しだと分からない**）。
     ⚠ **色も薄くしない。**⚠ 前は `--fs-label`（いちばん小さい字）＋ `--ink-dim` で、
       ⚠ **答えの本文より小さかった**（実測 2026-08-22: 問い 11px / 答え 15px）。
     ⚠ **問いが答えより小さいと、⚠ どこからどこまでが 1 つの問いか読めない。** */
  .land-q{font-size:var(--fs-claim);color:var(--ink);letter-spacing:.05em;
    margin:14px 0 4px;font-weight:600}
  /* ⚠ **答えは箇条書き**（2026-08-22。Owner 判断: `tmp/tmp3.md`）。
     ⚠ **数字は残す**（Owner 判断。掟 §6・ADR 0020: ⚠ 主張範囲の分母で書く）。
     ⚠ **印は `-`。**⚠ `⚠` を使わない（この画面では災害リスク専用）。 */
  #landAll .land-line,#landAll .land-den,#landAll .land-sub{position:relative;padding-left:1em}
  #landAll .land-line::before,#landAll .land-den::before,#landAll .land-sub::before{
    content:"・";position:absolute;left:0;color:var(--ink-dim)}
  /* ⚠ 1 つ目の問いは、⚠ 「今の位置」のすぐ下なので余白を足さない */
  #landAll .land-layer:first-child .land-q{margin-top:0}
  /* ⚠ 出ない層も、その層の位置に置く。⚠ 薄くするが、消さない */
  .land-miss{opacity:.8}
  /* ⚠ **畳んでも年は見える。**⚠ 見出しの行に置いてあるので、そのまま残る。 */
  /* ⚠ 建物についての但し書きは、**初期状態で見える場所**に置く。
     以前は左パネルの中にしか無く、スマホでは初期状態で1文字も見えなかった。
     今回は利用者が読んだあと自分で畳めるが、勝手には畳まず、入口と要点を残す。 */
  /* ⚠ 板を敷く。板なしで出したときは、10.5px・薄い色・影だけで航空写真の上に置いており、
     読めるのは琥珀色の数字だけだった（UI/UX の実測）。
     年が 60px、誤解を止める文が 10.5px で **5.7倍**。一瞥した人が受け取るのは
     「オレンジの数字が2つある」だけになる。出したのに読めないなら、出していないのと同じ。
     ⚠ 3D のジオメトリにも既定の色にも触らない。敷きと文字の大きさだけで直す。 */
  /* ⚠ 年（60px）に対して、これが 12px では「言い切っている」ことにならない。
     利用者の言葉:「写真の横に『これは今の街を重ねた絵です』と、写真と同じ大きさで書いてほしい」 */
  #over{margin-top:6px;font-size:var(--fs-claim);line-height:1.4;color:var(--estimate);
    letter-spacing:.02em;text-shadow:0 2px 12px rgba(0,0,0,.9)}
  #over:empty{display:none}
  #over b{color:var(--ink);font-weight:600}
  /* ⚠ 触る前の案内。押したら消える（役目が終わったものを常設しない）。
     以前は左パネルの中に「建物をクリックすると、その足元を判定する。」と書いてあったが、
     スマホはパネルが閉じて始まり、PC は内スクロールの外だったので、**誰も読んでいなかった**。
     3D で 100% 言えるのは足元だけなので、そこへ誘う1行は出す価値がある。 */
  /* 共有された状態を復元できなかったときの1行。
     ⚠ 警告色にはしない。壊れてはいない。共有元と別のものを見ている、という断り書き */
  #stateMiss{margin:0 0 7px;padding:6px 9px;border-radius:7px;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);
    color:var(--ink-dim);font-size:var(--fs-note);line-height:1.5}
  #stateMiss[hidden]{display:none}

  /* ============ パネル ============ */
  /* ⚠ **パネルは常に出す。⚠ 小さくできるだけ**（2026-08-22。Owner 判断）。
     ⚠ **既定は小さい状態**（地名 ＋ 3 つの問いの答え 1 行ずつ ＋「▾ 広げる」）。
     ⚠ **中央（調べている地点）を覆わない。**実測（2026-08-22）: 帯の下 58 〜 中央 320（320幅）
       ＝ ⚠ **262px 使える。**⚠ 小さい状態はその中に収める。 */
  #panel{position:absolute;top:14px;left:14px;z-index:11;width:300px;
    max-height:calc(100% - 190px);overflow-y:auto;
    background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:15px;
    backdrop-filter:blur(16px);transition:opacity .45s ease,transform .45s ease}
  /* ⚠ **`.hide` は無くなった**（2026-08-22）。⚠ 透明にして押せなくするのをやめた。 */
  /* ⚠ **押せる的は 44×44 を割らない**（`.claude/rules/css.md`）。
     ⚠ 実測（2026-08-22）: 狭い幅で字が隠れて ⚠ **34×44** だった（記号だけ）。 */
  #toggle{min-width:var(--tap)}
  /* ⚠ **小さい状態で隠すもの。**⚠ 各問いの「答えの 1 行目」だけ残す。
     ⚠ **消したのではない。**⚠ 「▾ 広げる」で全部読める（掟 §1: 事実は消さない）。 */
  /* ⚠ **小さい状態で出すもの／出さないもの**（2026-08-22。Owner 判断）。
     ⚠ **見た目は変えない。**⚠ 字の大きさも並びも、⚠ 広げたときと同じ。
       ⚠ **切り替えるのは「見出しの下の 2 行目以降を出すかどうか」だけ。**
     ⚠ **補足情報は、⚠ 小さいときこそ出す**
       （⚠ 「建物が消える年代は推定です」は、⚠ **建物が立っている絵と同時に読めないと意味がない**。
        ⚠ 広げると地図が隠れるので、⚠ **小さい状態＝地図が見えている状態でこそ要る**。掟 §1）。
     ⚠ **消したのではない。**⚠ 「▾ 広げる」で全部読める。 */
  #panel:not(.open) #status,
  #panel:not(.open) .land-den,
  #panel:not(.open) .land-layer:not(.land-miss) .land-sub,
  /* ⚠ 答えが出ない層は、⚠ 1 行目を残す（⚠ 問いを立てて答えないのは ADR 0026）。
     ⚠ `:first-of-type` は class ではなく **要素の種類**を見るので、⚠ 兄弟の 2 つ目以降で書く。 */
  #panel:not(.open) .land-miss .land-sub ~ .land-sub,
  /* ⚠ **内訳は 2 つある。⚠ 両方とも小さいときは隠す**（2026-08-22）。
     ⚠ 実測: ⚠ **`#areaBreak` を一覧に入れ忘れ、⚠ 面積の内訳 8 行だけが出ていた。**
     ⚠ **同じ「内訳」なのに片方だけ出るのは、⚠ 「小さい＝1 行目だけ」の判断に反する。** */
  #panel:not(.open) #areaBreak,
  #panel:not(.open) #breakdown,
  #panel:not(.open) .prov-q,
  #panel:not(.open) .sec:not(:first-of-type){display:none}
  /* ⚠ **狭い幅では、⚠ 小さくしているあいだ 3 つの問いごと畳む**（2026-08-23。Owner 判断）。
     ⚠ **実測（375×667・渋谷）**: ⚠ **地図が素で見えるのは 149px / 667px（22%）** しか無く、
       ⚠ **そのうえ「昔はどんな土地？」が y=322 で切れていた**（74px のうち 38px だけ）。
       ⚠ **切れた見出しは、⚠ 答えを読ませずに「壊れている」とだけ伝える。**
     ⚠ **消したのではない。**⚠ 「▾ 全画面で読む」で全部読める（掟 §1）。
     ⚠ **断り（`caveat`）は畳まない。**⚠ **絵と同時に読めないと意味がない**（掟 §1・§4-1）。
     ⚠ **畳むのは操作の案内（`tip`）だけ。**⚠ ? で出せる。
     ⚠ **広い幅には効かせない。**⚠ **PC は板と地図が並ぶので、⚠ 覆っていない。** */
  #panel:not(.open) #landAll{display:none}
  /* ⚠ **問いを畳んだら、⚠ その下の余白も畳む**（2026-08-23）。
     ⚠ **実測（375×667・渋谷）**: ⚠ **補足の下線の下に 23px の空白**が残り、
       ⚠ **「まだ続きがあって切れている」ように見えた。**⚠ 下線の下は板の余白だけでよい。 */
  #panel:not(.open) .sec-note{margin-bottom:0}
  #panel:not(.open) .sec-note:not(.sec-note--tips) #notes li[data-kind="tip"]{display:none}
  /* ⚠ **広げているときは ? を出さない**（⚠ 全部読めているので押す相手がいない。ADR 0026）。 */
  #panel.open .note-help{display:none}
  /* ⚠ 調べ終わった土地で、検索欄が最上段にあるのは順序として弱い。
     結果を先に出すと、いちばん遠かった「いま画面に出ているもの」が近くなる。
     実測（375×667・パネルを開いた状態）: 641px → 264px。
     UI を1つも足さずに到達距離だけ縮める（UI/UX レビューの案A+B）。 */
  #panel.col{display:flex;flex-direction:column}
  /* ⚠ **帯は必ず先頭**（2026-08-22。⚠ パネルの中へ移した）。
     ⚠ `#result` の `order:-1` が帯を後ろへ回していた（⚠ 実測: 帯が y=340＝パネルの外に出た）。 */
  /* ⚠ **順番は、⚠ 全部ここで決める**（2026-08-22）。
     ⚠ `#result` だけに `order` を付けていたので、⚠ **後から足したものが全部いちばん下へ回った**
       （⚠ 実測: 帯が y=340、⚠ PC の名乗りが y=1034）。⚠ **付けるなら全部に付ける。** */
  #panel.col > .chrome-row{order:-3}
  #panel.col > h1{order:-2}
  #panel.col > #result{order:-1}
  /* ⚠ ✕ は #chrome の中（← と同じ帯）に居る。**位置を自分で決めない。**
       以前はパネルの中で position:absolute だったので、パネルと一緒に流れて
       画面外へ消えた（実測 2026-08-18・375×667: 400px スクロールで y=-298）。 */
  /* ⚠ PC は地図が横に見えているので「地図へ」は嘘になる。字は狭い幅の全画面でだけ出す */
  h1{margin:0 0 2px;font-size:var(--fs-claim);letter-spacing:.05em}
  .lead{margin:0 0 12px;font-size:var(--fs-note);color:var(--ink-dim)}
  /* サービス名。共有リンクから来た人が「何のサイトか」「戻る先」を持てるように */
  .brand{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-note);letter-spacing:.18em;
    color:var(--ink-dim);text-decoration:none;margin-bottom:6px}
  a.brand:hover{color:var(--action)}
    .brand .mark{width:15px;height:15px;border-radius:3.5px;flex:none;display:block}
  .brand{align-items:center}
.brand b{font-weight:500;letter-spacing:.22em}

  .sec{margin-top:13px;padding-top:11px;border-top:1px solid var(--line)}
  /* ⚠ **いちばん上の節は、⚠ 自分で上の余白と区切りを作らない**（2026-08-23）。
     ⚠ **すぐ上に `.chrome-row` があり、⚠ あちらが敷きを持つので区切りになっている。**
     ⚠ **実測（375×667・渋谷）**: ⚠ **▾ の下端 y=70 から 地名 y=113 まで 43px が余白だけ**だった。
     ⚠ **狭い画面では、⚠ その 43px がそのまま地図の取り分。**
     ⚠ **`.sec` より後ろに置く**（⚠ 同じ強さなので、⚠ 前に置くと負ける。⚠ 実際に負けた）。 */
  .sec--place{margin-top:0;padding-top:0;border-top:0}
  .sec>.label{font-size:var(--fs-note);letter-spacing:.08em;color:var(--ink-dim);margin-bottom:8px}

  /* 検索 */
  #q{width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);
    background:rgba(255,255,255,.06);color:var(--ink);font:inherit;font-size:var(--fs-input)}
  #q:focus{outline:none;border-color:var(--action)}
  #cands{margin-top:6px;max-height:190px;overflow-y:auto}
  #cands button{display:block;width:100%;text-align:left;padding:6px 9px;margin-bottom:3px;
    border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--ink);
    font:inherit;font-size:var(--fs-note);cursor:pointer}
  #cands button:hover{border-color:var(--action);color:var(--action)}
  #cands button small{display:block;color:var(--ink-dim);font-size:var(--fs-note)}
  .quick{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
  .quick button{padding:3px 9px;border:1px solid var(--line);border-radius:999px;background:transparent;
    color:var(--ink-dim);font:inherit;font-size:var(--fs-note);cursor:pointer}
  .quick button:hover{border-color:var(--action);color:var(--action)}
  .here{width:100%;margin-top:7px;padding:7px;border-radius:7px;border:1px solid var(--line);
    background:transparent;color:var(--ink);font:inherit;font-size:var(--fs-note);cursor:pointer}
  .here:hover{border-color:var(--action);color:var(--action)}
  .here[disabled]{opacity:.5;cursor:default}
  .here-msg{margin-top:7px;padding:8px 10px;border-radius:7px;font-size:var(--fs-note);line-height:1.65;
    background:rgba(230,196,122,.09);border-left:2px solid var(--estimate);color:#cbb98f}
  .here-msg b{color:var(--estimate);font-weight:500}
  .here-msg .dim{color:var(--ink-dim)}


  #status{font-size:var(--fs-evidence);color:var(--ink-dim);line-height:1.55;min-height:1.5em}
  #status .err{color:var(--missing)}
  #status .go{color:var(--action)}
  /* 取れなかったときの復帰手段。断定の代わりに必ずこれを出す（掟: 取れなかったを「無い」と言わない） */
  #status .retry-btn{margin-top:6px;padding:4px 10px;border:1px solid var(--line);border-radius:6px;
    background:transparent;color:var(--action);font:inherit;font-size:var(--fs-note);cursor:pointer}
  #status .retry-btn:hover{border-color:var(--action)}

  .hero{font-size:var(--fs-hero);line-height:1;font-weight:200;font-variant-numeric:tabular-nums}
  /* 数字を出せないとき（「判定できません」「水域なし」）。文なので数字より小さい */
  .hero .hero-alt{font-size:var(--fs-hero-sm)}
  .hero small{font-size:var(--fs-lead);color:var(--ink-dim);margin-left:3px}
  .hero-cap{font-size:var(--fs-evidence);color:var(--ink-dim);margin-top:5px;line-height:1.5}
  /* ⚠ **地名はパネルの主語**（2026-08-22。⚠ 何について答えているか）。
     ⚠ 実測（2026-08-22・1280×800）: ⚠ **12.5px で、⚠ その下の問い（15px）より小さかった。**
       ⚠ **階層が逆転していた。**⚠ 主語がいちばん大きい。 */
  .place{font-size:var(--fs-place);font-weight:600;line-height:1.3;margin-bottom:9px}
  .stat{display:flex;justify-content:space-between;gap:8px;font-size:var(--fs-evidence);padding:2.5px 0;
    color:var(--ink-dim);font-variant-numeric:tabular-nums}
  .stat b{color:var(--ink);font-weight:500}
  /* ⚠ **凡例の色**（2026-08-22。Owner 判断）。
     ⚠ **こちらで決めた飾りではない。**⚠ **国土地理院の凡例から抽出した RGB そのもの**
       （`swale.js` の `SWALE[].rgb`。ADR 0017: ⚠ 凡例が機械可読でないものは重ねない）。
     ⚠ **地図に出ている色と同じ。**⚠ **判定の根拠そのものを見せている。**
     ⚠ **建物の内訳（`.swatch`）とは形を変える**（⚠ あちらは水／陸の 2 色で、⚠ 分母も違う）。
     ⚠ **色だけで区別しない。**⚠ 区分名が必ず隣にある（`ui-ux-review`）。 */
  .stat .legend{display:inline-block;width:10px;height:10px;margin-right:6px;
    border-radius:2px;border:1px solid rgba(255,255,255,.22);vertical-align:baseline}
  .swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  .prov{font-size:var(--fs-evidence);line-height:1.55;padding:7px 9px;border-radius:6px;margin-bottom:5px}
  .prov.ok{background:rgba(126,224,165,.09);border-left:2px solid var(--evidence)}
  .prov.est{background:rgba(230,196,122,.09);border-left:2px solid var(--estimate)}
  .prov.no{background:rgba(224,138,122,.09);border-left:2px solid var(--missing)}
  /* 押している間だけ光らせる。状態を残さないので、既定の絵（99.6% の色）を壊さない */
  .peek{display:inline-block;margin-top:5px;padding:3px 9px;border-radius:999px;
    border:1px solid var(--line);background:transparent;color:var(--ink-dim);
    font:inherit;font-size:var(--fs-note);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .peek:hover{border-color:var(--action);color:var(--action)}
  .peek:active{background:var(--action);color:#0b1017;border-color:var(--action)}
  /* ⚠ 実測 163×24px。自分で宣言している --tap:44px を割っていた。
       指の的にはマウスの的と同じ寸法を使わない（.ev-note.step / .quick button と同じ書き方） */
  @media (hover:none){ .peek{min-height:var(--tap)}}

  .prov .t{font-size:var(--fs-label);letter-spacing:.12em;margin-right:5px}
  .prov.ok .t{color:var(--evidence)}.prov.est .t{color:var(--estimate)}.prov.no .t{color:var(--missing)}
  .prov span.d{color:var(--ink-dim)}
  /* 押した場所に出すカード。⚠ 左パネルの中だけに書いていたときは、実測で
     y=672（スマホ・パネル閉）／y=721（PC・内スクロールの外）と、両方の端末で画面の外だった。 */
  .pick-pop .maplibregl-popup-content{background:rgba(11,14,19,.94);backdrop-filter:blur(10px);
    border:1px solid var(--line);border-radius:9px;padding:10px 12px;
    box-shadow:0 8px 28px rgba(0,0,0,.5)}
  .pick-pop .maplibregl-popup-tip{border-top-color:rgba(11,14,19,.94);
    border-bottom-color:rgba(11,14,19,.94)}
  .pick-pop .card{background:none;padding:0}
  .pick-pop .maplibregl-popup-close-button{color:var(--ink-dim);font-size:var(--fs-era);padding:2px 7px}
  /* ⚠ 指で押せる大きさ（var(--tap)）。ピンと同じ理由 */
  .pick-say{display:inline-flex;align-items:center;min-height:var(--tap);margin-top:8px;
    padding:0 12px;border:1px solid var(--line);border-radius:999px;background:transparent;
    color:var(--action);font:inherit;font-size:var(--fs-note);cursor:pointer}
  .pick-say:hover{border-color:var(--action)}
  /* ⚠ **`#pick` の見た目は消した**（2026-08-21）。⚠ パネルの板そのものを消したため。
     ⚠ **吹き出し側だけ残す。**⚠ 使われない見た目を残すと、⚠ 戻せてしまう。 */
  .pick-pop .name{font-weight:700;font-size:var(--fs-body);line-height:1.35;margin-bottom:5px}
  .pick-pop .v{font-size:var(--fs-lead)}.pick-pop .v.w{color:var(--water)}
  .pick-pop .meta{color:var(--ink-dim);font-size:var(--fs-evidence);margin-top:8px}
  .pick-pop .meta>div+div{margin-top:3px}
  .hint{font-size:var(--fs-note);color:var(--ink-dim);line-height:1.55}
  /* パネルは主役（3Dの絵）を隠すので、いつでも畳めるようにする。
     スマホでは画面の4割を占めるため、既定で閉じる。 */
  /* ⚠ 戻る手段は、常に見えている場所に置く。
     以前は左パネルの中の「←今昔」だけで、実測すると
       スマホ  y=688・18px・パネルは閉じて始まる → **画面に戻る手段が1つも無い**
       PC      y=737・18px・11px            → 最下端の細い行
     しかも「←今昔」はロゴに見えて、戻る操作に読めない。
     ⚠ var(--tap)（ピンと同じ理由）。地図の ＋−/コンパスも var(--tap) にそろえてある。 */
  /* ⚠ **上の積み上げ**（2026-08-22）。押せる行（← ☰ ✕）と、⚠ **押せない補足**（#notice）を
       ⚠ **同じ縦の流れ**に入れる。⚠ **固定値（top:96px など）で避けない**
       （CLAUDE.md §9。実測: 別々に置いた #hud が #land に 92px 食い込んだ）。
     ⚠ **右端も持つ。**持たないと、補足の幅が中身しだいで画面外へ伸びる。 */
  #chrome{position:absolute;top:14px;left:14px;right:14px;z-index:13;
    display:flex;flex-direction:column;align-items:flex-start;gap:9px;

      width:300px;max-width:none;max-height:calc(100% - 190px);

    /* ⚠ **PC は広げても左の縦パネルのまま**（2026-08-22）。
       ⚠ **狭い幅の「広げたら全画面」を打ち消す**（⚠ 既定は狭い幅なので、PC にも効いてしまう）。
       ⚠ 実測（2026-08-22）: 打ち消し忘れて、⚠ **PC で 300×800 の全画面高**になった。 */
    #panel.open{top:14px;left:14px;right:auto;bottom:auto;
      max-height:calc(100% - 190px);border-radius:11px;border:1px solid var(--line);
      padding:15px}

    /* ⚠ **PC では、板を開いていても HUD を出す。**⚠ 狭い幅は 3D を隠さないために消している */
    #panel ~ #hud{display:flex}
    /* ⚠ **補足も同じ。**⚠ 狭い幅は全画面で根拠を読むので消すが、⚠ **PC は地図が見えている。**
       ⚠ 実測（2026-08-22・1280×800・豊洲）: これを書かずに出したら、⚠ **補足が 0×0 になった**
         （狭い幅の規則が既定なので、PC でも効いていた）。
       ⚠ **推定の高さで建物が立った絵を、断りなしに見せることになる**（掟 §1）。 */

       ⚠ **`main` では両方が `:not(.hide)` で同じ強さだった。**⚠ 書き換えたときに弱めた。 */
    #panel.open ~ #chrome #notice,#panel ~ #chrome #notice{display:block}
    /* ⚠ **PC では 3 つの問いを畳まない**（2026-08-23）。⚠ **板と地図が並ぶので覆っていない。**
       ⚠ **既定（狭い幅）に書いたものは PC にも効く。**⚠ **ここで打ち消す**（`rules/css.md`）。 */

    /* ⚠ **打ち消しは、⚠ 同じ形で書く**（2026-08-23）。

         ⚠ 既定の `#panel:not(.open) .sec-note:not(.sec-note--tips) #notes li[…]`

         ⚠ **PC には ? が無いので出す手段が無かった**）。 */
    #panel:not(.open) .sec-note:not(.sec-note--tips) #notes li[data-kind="tip"]{display:list-item}

         ⚠ **年・種別・接続を `.time-panel` の見出しの行へ移した。**

         ⚠ **`#era` 側の指定は消してある。** */
    #hud{gap:0}

    /* ⚠ **全体は畳まない**（Owner 決定 2）。⚠ 畳むのは「年代を動かす」操作部だけ。

       ⚠ **年は見出しの行にあるので、⚠ 畳んでも消えない**（2026-08-22 に器を 1 つにした）。 */
  }
  /* ============ 動きを減らす ============ */
  /* ⚠ OS・ブラウザで「動きを減らす」を入れている人には、動きだけを消す。
     ⚠ **消すのは動きであって、結果ではない。** 年代は変わるし、寄せた先へも行く。

  @media (prefers-reduced-motion: reduce){
