<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<!-- URL に地名と座標が載る。押した先へ Referer で渡さない。
     _headers と二重にしてある。片方が効かない配信経路があっても漏らさないため。

     no-referrer ではなく same-origin。外へは一切送らないのは同じだが、
     こちらは同じサイトの中では残る。/deep が「どこから来たか」を読み、
     「← ひとつ前へ」を出すのに要る（back.js）。
     no-referrer にしたら、同じサイトから来ても直前へ返せなくなった。 -->
<meta name="referrer" content="same-origin">
<title>この土地は、昔なんだったのか？ — 今昔</title>
<meta name="description" content="その土地が昔なんだったかを、国土地理院の資料を実際に読んで答えます。読んだ資料まで根拠として出します。保存して、あとで深掘りできます。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="今昔">
<meta property="og:title" content="この土地は、昔なんだったのか？ — 今昔">
<meta property="og:description" content="その土地が昔なんだったかを、国土地理院の資料を実際に読んで答えます。読んだ資料まで根拠として出します。保存して、あとで深掘りできます。">
<meta property="og:url" content="https://konjaku.hidetzu.work/">
<meta property="og:image" content="https://konjaku.hidetzu.work/ogp.png">
<meta property="og:image:alt" content="この土地は、昔なんだったのか？ — 土地の成り立ちを、根拠とともに見る">
<meta property="og:locale" content="ja_JP">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="この土地は、昔なんだったのか？ — 今昔">
<meta name="twitter:description" content="その土地が昔なんだったかを、国土地理院の資料を実際に読んで答えます。読んだ資料まで根拠として出します。保存して、あとで深掘りできます。">
<meta name="twitter:image" content="https://konjaku.hidetzu.work/ogp.png">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./theme.css">
<link rel="stylesheet" href="./brand.css">
<link rel="stylesheet" href="./top.css">
<link rel="stylesheet" href="./tabs.css">

<div id="app">
  <!-- 目には出さないが、読み上げと OGP の名乗りのために持つ。
       この画面は地図が主役で、見出しを置く場所が無い。
       β 版の /peel が同じ理由で同じ形を持っていた。
       OGP の見出しと同じ字であることは scripts/generate-ogp.mjs が突き合わせる。 -->
  <h1 class="sr-only">この土地は、昔なんだったのか？</h1>
  <div id="map" role="application" aria-label="地図"></div>
  <!-- 名乗り。何のサイトかを、画面のどこにも書いていなかった。
       同じ問題を β 版が実測で踏んで、同じ形で解いている。 -->
  <header class="brand">
    <div class="brand__inner">
      <a class="brand__name" href="./">
        <img class="brand__mark" src="./favicon.svg" alt="" width="20" height="20">
        <span class="brand__words"><span class="brand__title">今昔</span><span class="brand__tag">この土地は、昔なんだったのか？</span></span>
      </a>
      <nav class="brand__nav" aria-label="主な行き先">
        <a class="brand__link" href="./" aria-current="page">地図で調べる</a>
      </nav>
      <details class="menu">
        <summary class="menu__btn" aria-label="メニュー">
          <span class="menu__bars" aria-hidden="true"></span>
        </summary>
        <nav class="menu__panel" aria-label="サイトの案内">
          <a class="menu__item" href="./about">このサイトについて</a>
          <a class="menu__item" href="./privacy">プライバシーポリシー</a>
          <a class="menu__item" href="./terms">利用規約</a>
          <a class="menu__item" href="https://github.com/hidetzu/konjaku/issues/new?template=feedback.yml" target="_blank" rel="noopener">ご意見・不具合報告（GitHub で公開）</a>
        </nav>
      </details>
    </div>
  </header>
  <div class="column" id="bar">
    <form id="find" role="search">
      <input id="q" type="search" placeholder="住所・場所を検索"
             autocomplete="off" enterkeyhint="search" aria-label="住所・場所を検索">
    </form>
    <button id="here" type="button" title="いまいる場所から">
      <span aria-hidden="true">📍</span><span class="sr">いまいる場所から</span>
    </button>
  </div>
  <ul class="column" id="hits" role="listbox" aria-label="検索の候補" hidden></ul>


  <!-- ⚠ **出典明示は、地理院タイルの利用の条件。**⚠ **隠さない・覆わない。**
       ⚠ **板と同じ積み上げに入れる。**⚠ 固定値で位置を決めると、
       ⚠ **板の高さが場所ごとに変わる（271〜325px）ので重なる。** -->
  <div class="column" id="bottom">
    <!-- 3 手。初めて開いた人が、説明を読まずに何をすればよいか分かるように置く。
         実測（2026-09-02・375x667・本番）: 最初の画面に押せるものが 14 個あり、
         色で塗られているのは 2 個（現在地と出典）だけだった。答えは出ているのに、
         次に何をすればよいかを言う字がどこにも無かった。
         常時出す。閉じる操作も、2 回目から隠す仕掛けも持たない。
           邪魔だという観測が出てから隠す。先に隠す仕掛けを作らない。
         ⚠ 出典・答えの板と同じ積み上げに入れる。上から置くと重なる。
           実際に踏んだ（2026-09-02）: 検索欄の下に固定で置いたら、320x640 で
           出典と 35px 重なった。板の高さは土地と幅で変わるので、避けようがない。
         ⚠ 押せない。触ると地図が動く（pointer-events を通す）。
           押せる見た目にしないこと。押しても何も起きない導線を置かない。
         ⚠ 矢印は読み上げから外す。順を表す記号で、読む字ではない。 -->
    <p class="steps" id="steps"><span class="steps__i">① 場所を選ぶ</span><span
       class="steps__sep" aria-hidden="true"> → </span><span class="steps__i">② 昔を知る</span><span
       class="steps__sep" aria-hidden="true"> → </span><span class="steps__i">③ 写真で見くらべる</span></p>

    <p class="attrib"><a href="https://maps.gsi.go.jp/development/ichiran.html"
       target="_blank" rel="noopener">出典 国土地理院</a></p>

  <section id="card" aria-live="polite">
    <p class="kick">
      <span class="kick__l"><i class="dot" aria-hidden="true"></i><span id="kickText">地図を動かすと、その場所を調べます</span></span>
      <button class="share" id="share" type="button" aria-label="この場所のリンクを送る" hidden>
        <span aria-hidden="true">⇱</span><span id="shareText">送る</span>
      </button>
      <button class="save" id="save" type="button" aria-pressed="false" hidden>
        <span aria-hidden="true" id="saveMark">☆</span><span id="saveText">保存</span>
      </button>
    </p>
    <!-- 現在地が取れなかったときの断り。名乗りの行には入らない。
         名乗りは送る・保存と同じ行なので、器が 375px で 177px・320px で 131px しかなく、
         そこへ断りを入れると切れる。実測（2026-09-02）: 断りは 33 字で 396px 要る。
         元の字（28 字）も、同じ理由で切れていた。
         こちらは自分の行を持つので、折り返して 2 行まで伸ばせる。 -->
    <p class="kick__note" id="kickNote" hidden></p>

    <!-- 答えの出典。見出しの上に小さく置く。2 つの資料が独立に同じことを言っているのが
         価値なのに、出典を名乗らないと繰り返しに読まれた（利用者役 5 名中 3 名）。 -->
    <p class="ans__src" id="glossSrc" hidden></p>
    <p class="ans" id="gloss">　</p>
    <p class="sub" id="sub"></p>

    <!-- 空中写真の年代。押すと、その年代の写真が地図になる。
         チップの直上に「これは何か」を置く。置かないと、押す前に
         「いつ変わったか」と読まれる（利用者役 5 名中 3 名）。 -->
    <p class="eras__label" id="erasLabel" hidden>
      <i class="eras__mark" aria-hidden="true"></i><span id="erasLabelText"></span>
    </p>
    <div class="eras" id="eras" role="group" aria-label="空中写真の年代" hidden></div>
    <p class="era-note" id="eraNote" hidden></p>
    <button class="era-back" id="eraBack" type="button" hidden>地図に戻す</button>

    <!-- 根拠は 1 か所にまとめる。その場では読まれない側。 -->
    <details class="why" id="why">
      <summary class="why__sum">なぜそう言える？</summary>
      <dl class="why__rows">
        <div class="why__row">
          <dt class="why__k">いまの地形</dt><dd class="why__v" id="name"></dd>
        </div>
        <div class="why__row" id="meijiRow" hidden>
          <dt class="why__k">明治期の地図</dt><dd class="why__v" id="meiji"></dd>
        </div>
        <div class="why__row" id="photoRow" hidden>
          <dt class="why__k">空中写真</dt><dd class="why__v" id="photo"></dd>
        </div>
        <div class="why__row" id="areaRow" hidden>
          <dt class="why__k">この周辺</dt>
          <dd class="why__v">
            <span class="why__note" id="areaNote"></span>
            <span class="why__body" id="area"></span>
            <span class="why__cite" id="areaCite"></span>
          </dd>
        </div>
      </dl>
      <!-- 帰宅後に読む画面へ。散歩中は押されない前提だが、押せる形にはしておく。 -->
      <a class="why__more" id="deepLink" href="./deep">この場所をもっと深く読む →</a>
    </details>
    <ul id="legend" aria-label="この画面に映っている土地"></ul>
    <button id="more" type="button" hidden></button>
  </section>

  </div>



  <section class="column" id="sheet" hidden aria-label="この画面に映っている土地">
    <header>
      <h2>この画面に映っている土地</h2>
      <button class="close" type="button" id="sheetClose" aria-label="閉じる">✕</button>
    </header>
    <ul id="sheetList"></ul>
    <p class="state" id="sheetState" hidden></p>
  </section>
</div>

<!-- 下の帯。主な行き先は 2 つだけ（地図と保存した場所）。
     深掘りは場所を選んでから決まるので、ここには置けない（行き先が定まらない）。
     案内（このサイトについて・プライバシー・利用規約）は名乗りのメニューが持つ。 -->
<nav class="tabs" aria-label="主な行き先">
  <div class="tabs__inner">
  <a class="tabs__item" href="./" aria-current="page">
    <svg class="tabs__icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="M12 2a7 7 0 0 0-7 7c0 5.2 7 13 7 13s7-7.8 7-13a7 7 0 0 0-7-7Zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5Z"/>
    </svg>
    <span>地図</span>
  </a>
  <a class="tabs__item" href="./saved">
    <svg class="tabs__icon" viewBox="0 0 24 24" aria-hidden="true" fill="currentColor">
      <path d="m12 17.3-5.8 3.3 1.5-6.6L2.6 9.5l6.7-.6L12 2.7l2.7 6.2 6.7.6-5.1 4.5 1.5 6.6z"/>
    </svg>
    <span>保存した場所</span>
  </a>
  </div>
</nav>
